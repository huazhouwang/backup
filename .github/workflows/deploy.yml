name: Deploy

# Deploys to Cloudflare on demand from the Actions tab. Configure in GitHub → Settings →
# Secrets and variables → Actions:
#   secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BETTER_AUTH_SECRET, ENCRYPTION_SECRET
#   variable APP_URL (optional: a custom domain; defaults to the workers.dev address)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: folio-db
      WORKER_NAME: folio
    steps:
      - name: Check configuration
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET ENCRYPTION_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Set the $name secret (README → Deploy)."; exit 1; fi
          done

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve the app URL
        id: url
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          subdomain=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          workers_dev=${subdomain:+https://$WORKER_NAME.$subdomain.workers.dev}
          url=${APP_URL%/}
          url=${url:-$workers_dev}
          if [ -z "$url" ]; then
            echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once, or set the APP_URL variable."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$workers_dev" ] && [ "$workers_dev" != "$url" ]; then
            echo "extra=$workers_dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the web app
        run: pnpm --filter @folio/web build

      - name: Create the database if needed
        working-directory: apps/api
        run: |
          db_id() { pnpm exec wrangler d1 list --json | jq -r --arg name "$1" '.[] | select(.name == $name) | .uuid'; }
          id=$(db_id "$DB_NAME")
          if [ -z "$id" ]; then
            pnpm exec wrangler d1 create "$DB_NAME"
            id=$(db_id "$DB_NAME")
          fi
          # The repository keeps a placeholder; account-specific IDs stay out of git.
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" ../../wrangler.jsonc
          grep -q "$id" ../../wrangler.jsonc

      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote --config ../../wrangler.jsonc

      - name: Deploy
        working-directory: apps/api
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          APP_URL: ${{ steps.url.outputs.url }}
          TRUSTED_ORIGINS: ${{ steps.url.outputs.extra }}
        run: |
          secrets="$RUNNER_TEMP/secrets.json"
          node -e '
            const names = ["BETTER_AUTH_SECRET", "ENCRYPTION_SECRET"]
            const set = Object.fromEntries(names.map((n) => [n, process.env[n]]))
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(set), { mode: 0o600 })
          ' "$secrets"
          vars=(--var "BETTER_AUTH_URL:$APP_URL")
          if [ -n "$TRUSTED_ORIGINS" ]; then vars+=(--var "TRUSTED_ORIGINS:$TRUSTED_ORIGINS"); fi
          pnpm exec wrangler deploy --config ../../wrangler.jsonc --secrets-file "$secrets" "${vars[@]}"
          rm -f "$secrets"

      - name: Smoke test
        env:
          APP_URL: ${{ steps.url.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$APP_URL/api/health" | grep -q '"ok":true'; then
              echo "### Deployed to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$APP_URL/api/health did not answer ok"
          exit 1
