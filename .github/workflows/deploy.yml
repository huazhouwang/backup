name: Deploy

# Deploys main to Cloudflare when it changes, or on demand from the Actions tab. Changes
# reach main through pull requests whose CI already passed on the merged result, so the
# deploy does not wait for CI to run again on main (it still runs there, as a record).
# Configure in GitHub → Settings → Secrets and variables → Actions (see docs/deploy.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: lullabo-db
      # The database the app used before it was renamed: copied once into DB_NAME when that
      # is first created, and left as it was, as a backup.
      FORMER_DB_NAME: bobo-db
      WORKER_NAME: lullabo
    steps:
      - name: Check configuration
        id: config
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy skipped: set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/deploy.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "::error::Set the BETTER_AUTH_SECRET secret (a random string of 32+ characters)."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Resolve the app URL
        if: steps.config.outputs.ready == 'true'
        id: url
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          subdomain=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain // empty')
          workers_dev=${subdomain:+https://$WORKER_NAME.$subdomain.workers.dev}
          # A custom domain (APP_URL) is canonical; workers.dev keeps working as an extra origin.
          url=${APP_URL%/}
          url=${url:-$workers_dev}
          if [ -z "$url" ]; then
            echo "::error::No workers.dev subdomain yet. Open Workers & Pages in the Cloudflare dashboard once to create it, or set the APP_URL variable."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$workers_dev" ] && [ "$workers_dev" != "$url" ]; then
            echo "extra=$workers_dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the web app
        if: steps.config.outputs.ready == 'true'
        env:
          # Copies at other addresses (the one it had before, workers.dev) point people here.
          APP_URL: ${{ steps.url.outputs.url }}
        run: pnpm --filter @lullabo/web build

      - name: Create the database if needed
        if: steps.config.outputs.ready == 'true'
        id: db
        working-directory: apps/api
        run: |
          db_id() { pnpm exec wrangler d1 list --json | jq -r --arg name "$DB_NAME" '.[] | select(.name == $name) | .uuid'; }
          id=$(db_id)
          if [ -z "$id" ]; then
            # Asia-Pacific is closest to the app's first (Chinese-speaking) users.
            pnpm exec wrangler d1 create "$DB_NAME" --location apac
            id=$(db_id)
            former=$(DB_NAME=$FORMER_DB_NAME db_id)
            if [ -n "$FORMER_DB_NAME" ] && [ -n "$former" ]; then
              echo "copied=true" >> "$GITHUB_OUTPUT"
              # Everything in the former database, migrations table included, so the
              # migrations step finds nothing left to apply.
              dump="$RUNNER_TEMP/former.sql"
              pnpm exec wrangler d1 export "$FORMER_DB_NAME" --remote --output "$dump"
              pnpm exec wrangler d1 execute "$DB_NAME" --remote --file "$dump" --yes
              rm -f "$dump"
              ./scripts/compare-databases.sh "$FORMER_DB_NAME" "$DB_NAME"
            fi
          fi
          # The repository keeps a placeholder; account-specific IDs stay out of git.
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" ../../wrangler.jsonc
          grep -q "$id" ../../wrangler.jsonc

      - name: Apply database migrations
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Deploy
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/api
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_URL: ${{ steps.url.outputs.url }}
          TRUSTED_ORIGINS: ${{ steps.url.outputs.extra }}
        run: |
          # Secrets are uploaded with the new version; unset optional ones are left out.
          secrets="$RUNNER_TEMP/secrets.json"
          node -e '
            const names = ["BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "RESEND_API_KEY", "ENCRYPTION_SECRET"]
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]))
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(set), { mode: 0o600 })
          ' "$secrets"
          vars=(--var "BETTER_AUTH_URL:$APP_URL")
          if [ -n "$TRUSTED_ORIGINS" ]; then vars+=(--var "TRUSTED_ORIGINS:$TRUSTED_ORIGINS"); fi
          if [ -n "$EMAIL_FROM" ]; then vars+=(--var "EMAIL_FROM:$EMAIL_FROM"); fi
          pnpm exec wrangler deploy --secrets-file "$secrets" "${vars[@]}"
          rm -f "$secrets"

      - name: Smoke test
        if: steps.config.outputs.ready == 'true'
        env:
          APP_URL: ${{ steps.url.outputs.url }}
          WORKERS_DEV: ${{ steps.url.outputs.extra }}
        run: |
          ok() { curl -fsS "$1/api/health" | grep -q '"ok":true'; }
          for attempt in 1 2 3 4 5; do
            if ok "$APP_URL"; then
              echo "### Deployed to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          # A domain not yet attached to this Worker (a new name or a move): it runs all the same.
          if [ -n "$WORKERS_DEV" ] && ok "$WORKERS_DEV"; then
            echo "::warning::$APP_URL does not answer yet; attach it to the $WORKER_NAME Worker (docs/deploy.md). $WORKERS_DEV is up."
            exit 0
          fi
          echo "::error::$APP_URL/api/health did not answer ok"
          exit 1

      - name: Compare with the former database
        # Right after a copy: anything written to the former database while the app switched
        # over shows here, to bring across by hand.
        if: steps.config.outputs.ready == 'true' && steps.db.outputs.copied == 'true'
        working-directory: apps/api
        run: ./scripts/compare-databases.sh "$FORMER_DB_NAME" "$DB_NAME" --warn
