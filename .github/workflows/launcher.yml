name: launcher

on:
  push:
    paths:
      - 'launcher/**'
      - 'ci/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

jobs:
  # 编译 APK、代码检查、单元测试 + 多分辨率截图
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 版本号 = 提交数，需要完整历史
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # 签名密钥来自 GitHub Secrets（Q5HOME_KEYSTORE 是 base64 后的密钥文件）。main 上没有密钥就失败，
      # 绝不用错误的签名发布；其它分支没有密钥时用临时调试签名，只能测试。
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.Q5HOME_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.Q5HOME_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::缺少签名密钥（Secrets: Q5HOME_KEYSTORE / Q5HOME_KEYSTORE_PASSWORD），main 上不能构建发布版"
              exit 1
            fi
            echo "::warning::没有签名密钥，用临时调试签名（不能覆盖安装正式版本）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/q5home.keystore"
          echo "Q5HOME_KEYSTORE_FILE=$RUNNER_TEMP/q5home.keystore" >> "$GITHUB_ENV"
          echo "Q5HOME_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build, lint, test
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :fakeapps:assembleRelease

      # 核对：APK 的签名证书必须和私有密钥一致（防止配置出错时悄悄用了别的签名）。
      - name: Check APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk_fp=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "APK 签名证书 SHA-256：$apk_fp"
          if [ -n "${Q5HOME_KEYSTORE_FILE:-}" ]; then
            key_fp=$(keytool -list -v -keystore "$Q5HOME_KEYSTORE_FILE" -storepass "$Q5HOME_KEYSTORE_PASSWORD" -alias q5home \
              | grep -m1 'SHA256:' | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
            if [ "$apk_fp" != "$key_fp" ]; then
              echo "::error::APK 的签名和私有密钥不一致（密钥别名必须是 q5home）"
              exit 1
            fi
            echo "✅ 已用私有密钥签名"
          fi

      - id: version
        run: echo "version=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: q5home-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fakeapps-apk
          path: launcher/fakeapps/build/outputs/apk/*/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: launcher/app/build/screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            launcher/app/build/reports/tests/
            launcher/app/build/reports/lint-results-release.html

  # 安卓 12 模拟器（1920x720，车机常见比例）上实际点一遍：截图 + 带字幕和点击圆环的录屏
  emulator-demo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: q5home-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: fakeapps-apk
          path: fakeapps

      # Pillow：截图标点击位置、画圆环；ffmpeg + 中文字体：加工视频。
      - name: Install Pillow, ffmpeg, CJK font
        run: |
          pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run demo on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1920x720
          script: python3 ci/demo.py --launcher apk/app-release.apk --fake fakeapps/zlink/release/fakeapps-zlink-release.apk --fake fakeapps/oem/release/fakeapps-oem-release.apk --out demo-out

      # 视频下方加字幕栏，点击 / 长按处画圆环；原始录屏留作 demo-raw.mp4。
      - name: Render demo video
        if: always()
        run: python3 ci/render_video.py demo-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-demo
          path: demo-out/

  # 推送到 main：发布 GitHub Release（车机里的"检查更新"读这里）。
  # 必须等模拟器演示也通过（演示里桌面崩溃会失败），崩溃的版本不会发到车机。
  release:
    needs: [build, emulator-demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: q5home-apk
          path: apk
      - name: Name the APK, write release notes
        run: |
          mv apk/app-release.apk "apk/q5home-${{ needs.build.outputs.version }}.apk"
          # 更新说明 = 提交信息（去掉署名行），车机"版本更新"页面会显示。
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Q5 Home ${{ needs.build.outputs.version }}
          body_path: notes.md
          files: apk/q5home-${{ needs.build.outputs.version }}.apk
          make_latest: true
