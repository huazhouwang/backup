name: wallpapers

# 每天给 wallpapers/feed.json 追加几张 Unsplash 新壁纸，车机连 Wi-Fi 时会下载（见 OnlineWallpapers.kt）。
# 需要仓库 Secret：UNSPLASH_ACCESS_KEY（Unsplash 开发者后台的 Access Key）；没配就跳过，不会失败。
# 只改 feed.json，不会触发 launcher 工作流，也不会发布新版本。
on:
  schedule:
    - cron: '47 19 * * *' # 每天一次（UTC 19:47）
  workflow_dispatch:
    inputs:
      count:
        description: '这次加几张'
        default: '3'

permissions:
  contents: write

concurrency:
  group: wallpapers
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: feed
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 wallpapers/update_feed.py --count "${{ github.event.inputs.count || '3' }}"

      - name: Commit
        if: steps.feed.outputs.added != '' && steps.feed.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpapers/feed.json
          git commit -m "壁纸清单：自动加入 ${{ steps.feed.outputs.added }} 张 Unsplash 新图"
          git push origin HEAD:main
