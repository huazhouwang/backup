plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本：versionName = 1.0.<提交数>，versionCode = 提交数 × 10（只增不减）。
// "回退发布"用旧代码重新编译，版本号取当前提交数 × 10 + 1~9（versionName 1.0.<提交数>.<n>），
// 由 rollback 工作流通过环境变量 VERSION_CODE / VERSION_NAME 传入，这样车机会把它当作普通更新安装。
def commitCount = {
    try {
        return providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }
            .standardOutput.asText.get().trim().toInteger()
    } catch (Exception ignored) {
        return 1
    }
}()

android {
    namespace 'com.x0finch.q5home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.x0finch.q5home'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: "${commitCount * 10}").toInteger())
        versionName System.getenv('VERSION_NAME') ?: "1.0.$commitCount"
    }

    // 签名：用车主自己的私有密钥（不放在仓库里），新版本才能覆盖安装旧版本。
    //  - 本地：~/.gradle/gradle.properties 里写 Q5HOME_KEYSTORE=<密钥路径>、Q5HOME_KEYSTORE_PASSWORD=<密码>
    //  - CI：GitHub Secrets 解码出的文件，路径在环境变量 Q5HOME_KEYSTORE_FILE，密码在 Q5HOME_KEYSTORE_PASSWORD
    // 都没有时用临时的调试签名，只能自己测试，不能覆盖安装正式版本（main 上的 CI 会拒绝构建）。
    def keystorePath = System.getenv('Q5HOME_KEYSTORE_FILE') ?: findProperty('Q5HOME_KEYSTORE')
    def keystorePassword = System.getenv('Q5HOME_KEYSTORE_PASSWORD') ?: findProperty('Q5HOME_KEYSTORE_PASSWORD')
    def hasReleaseKey = keystorePath && keystorePassword && file(keystorePath).isFile()
    signingConfigs {
        if (hasReleaseKey) {
            q5home {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias 'q5home'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig hasReleaseKey ? signingConfigs.q5home : signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.q5home : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // 截图测试的输出目录，CI 会上传。
            systemProperty 'screenshots.dir', layout.buildDirectory.dir('screenshots').get().asFile.path
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 仅测试用，不进 APK。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
