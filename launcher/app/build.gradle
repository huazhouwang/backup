plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本：versionName = 1.0.<提交数>，versionCode = 提交数 × 10（只增不减）。
// "回退发布"用旧代码重新编译，版本号取当前提交数 × 10 + 1~9（versionName 1.0.<提交数>.<n>），
// 由 rollback 工作流通过环境变量 VERSION_CODE / VERSION_NAME 传入，这样车机会把它当作普通更新安装。
def commitCount = {
    try {
        return providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }
            .standardOutput.asText.get().trim().toInteger()
    } catch (Exception ignored) {
        return 1
    }
}()

android {
    namespace 'com.x0finch.q5home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.x0finch.q5home'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: "${commitCount * 10}").toInteger())
        versionName System.getenv('VERSION_NAME') ?: "1.0.$commitCount"
    }

    // 所有构建（本地、CI、Release）用同一把签名，新版本才能覆盖安装旧版本。
    // 密钥按你的选择放在仓库里（公开仓库：别人也能用它签名，见 README 说明）。
    signingConfigs {
        q5home {
            storeFile file('../signing/q5home.keystore')
            storePassword 'q5home-public'
            keyAlias 'q5home'
            keyPassword 'q5home-public'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.q5home
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.q5home
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // 截图测试的输出目录，CI 会上传。
            systemProperty 'screenshots.dir', layout.buildDirectory.dir('screenshots').get().asFile.path
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 仅测试用，不进 APK。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
